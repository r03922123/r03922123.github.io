# Runs scripts/gates.sh, the same script as locally, on every PR to main and on main itself. It checks; Pages deploys.
name: gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:                     # a newer push to the same branch cancels the older run
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30          # builds take ~3 min; the rest allows for installing torch on a cold cache
    steps:
      # Actions pinned to full commit SHAs: a moved tag would run new code in a job that can read the denylist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      # Every package pinned by hash, and wheels only (a source build would fetch unhashed build tools), since the
      # post code runs while the denylist is on disk.
      - name: Install the post code's packages
        # Quoted, because ":all: " unquoted is a YAML mapping and the whole workflow fails to parse.
        run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-ci.txt'
      # The secret reaches this one step only, through step-level env: the post build forwards its whole
      # environment to every post script. It is stored base64-encoded because the runner masks each line of a
      # secret as a substring of every log line, so a short term inside a longer word would show as *** with
      # its neighbouring letters around it, and could be guessed from them. Unset (forks, or before it is set), it decodes to an empty
      # file and check.py fails closed.
      - name: Write the denylist
        env:
          SITE_DENYLIST: ${{ secrets.SITE_DENYLIST }}
        run: printf '%s' "$SITE_DENYLIST" | base64 -d > scripts/denylist.local.txt
      - name: Run the gates
        run: sh scripts/gates.sh
